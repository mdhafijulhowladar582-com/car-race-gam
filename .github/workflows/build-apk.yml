name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          test -n "$ZIP" || { echo "::error::No .zip found in repo root"; exit 1; }
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          PF=$(find _src -name project.godot | head -n 1)
          test -n "$PF" || { echo "::error::project.godot not found inside zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PF")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$PF")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/**
            /usr/local/bin/godot
          key: ${{ runner.os }}-godot-4.7-android-v1

      - name: Download Godot 4.7 and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mv templates/* ~/.local/share/godot/export_templates/4.7.stable/
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -f Godot_v4.7-stable_linux.x86_64.zip Godot_v4.7-stable_export_templates.tpz

      - name: Configure Godot Android SDK and debug keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.config/godot
          rm -f ~/.config/godot/debug.keystore
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.config/godot/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret missing - generating a temporary keystore. Google Sign-In needs a stable keystore SHA-1."
            keytool -genkeypair -v -keystore ~/.config/godot/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          test -f ~/.config/godot/debug.keystore
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.config/godot/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Godot Android build template
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          mkdir -p android/plugins android/build
          touch android/build/.gdignore
          printf '4.7.stable' > android/.build_version
          unzip -q ~/.local/share/godot/export_templates/4.7.stable/android_source.zip -d android/build

      - name: Build Google Sign-In Android plugin
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          ./gradle-8.11.1/bin/gradle -p android_plugin :plugin:assemble --no-daemon
          test -s addons/firebase_google_signin/bin/debug/FirebaseGoogleSignIn-debug.aar
          test -s addons/firebase_google_signin/bin/release/FirebaseGoogleSignIn-release.aar
          rm -f gradle-8.11.1-bin.zip

      - name: Import Godot project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --path . --editor --quit || true
          test -f project.godot
          test -f scripts/main.gd
          test -f scripts/player_car.gd
          test -f scripts/ai_car.gd

      - name: Export debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f CarRaceGames.apk
          godot --headless --path . --export-debug Android CarRaceGames.apk
          test -s CarRaceGames.apk
          ls -la CarRaceGames.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Race-Games-APK
          path: ${{ env.PROJECT_DIR }}/CarRaceGames.apk
          if-no-files-found: error
